[package]
name = "termgram-notify"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SSE stream for Telegram: push new incoming messages over HTTP events"
repository = "https://github.com/liagha/termgram"

[dependencies]
termgram = { path = "../core", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"