[package]
name = "termgram-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Telegram MTProto client for the terminal: messages, media, contacts, scheduled sends"
repository = "https://github.com/liagha/termgram"

[[bin]]
name = "termgram"
path = "src/main.rs"

[dependencies]
termgram = { path = "../core", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
serde = "1"
grammers-client = { version = "0.10", default-features = false }